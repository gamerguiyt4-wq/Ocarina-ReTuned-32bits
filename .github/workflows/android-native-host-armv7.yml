name: Android native host prototype (armeabi-v7a, experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-native-host-armv7-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-host:
    name: Android ARMv7 (32-bit) native host
    env:
      CCACHE_DIR: ${{ github.workspace }}/.compiler-cache-android-armv7
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: coccofresco/TriAevum
          ref: 17218b0cfdb944645bb5cde5249f313dca7e53ce
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v5
        id: native_cache
        with:
          path: .compiler-cache-android-armv7
          key: native-android-armv7-v1-${{ github.sha }}
          restore-keys: native-android-armv7-v1-
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache nlohmann-json3-dev
          python -m pip install 'cmake==3.31.6' ninja
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: Apply Android port fixes
        run: |
          python tools/native/apply_android_port.py engine
          python tools/native/apply_armv7_port.py engine
          python tools/reframed/apply_native_port.py engine
          python tools/reframed/apply_renderer_port.py engine
          python tools/native/apply_audio_port.py engine
          python tools/frontend/apply_frontend_port.py engine
      - name: Configure neutral native host
        run: |
          cmake -S engine/ports/android/runtime -B build/host -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=." \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=." \
            -DTHREE_DS_RECOMP_ENABLE_IMMERSE=OFF \
            -DTHREE_DS_RECOMP_ENABLE_NRI_UPSCALER_SDKS=OFF \
            -DTHREE_DS_RECOMP_ENABLE_DLSS_MODULE=OFF
      - name: Build neutral native host
        run: cmake --build build/host --parallel 3 --target oot3d_native_game oot3d_native_pica_frontend_tests
      - name: Stage neutral libraries
        run: python tools/native/stage_android_host.py --engine engine --build build/host --ndk "$ANDROID_HOME/ndk/29.0.14206865" --abi armeabi-v7a --output artifacts/Ocarina-ReTuned-Native-Android-armv7.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: Ocarina-ReTuned-Native-Android-armv7-${{ github.sha }}
          path: artifacts/Ocarina-ReTuned-Native-Android-armv7.tar.gz
          if-no-files-found: error
      - uses: actions/cache/save@v5
        if: always() && steps.native_cache.outputs.cache-hit != 'true'
        with:
          path: .compiler-cache-android-armv7
          key: native-android-armv7-v1-${{ github.sha }}
